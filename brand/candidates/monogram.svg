  <path fill-rule="evenodd" d="M144 52 L368 52 C418.81 52 460 93.19 460 144 L460 368 C460 418.81 418.81 460 368 460 L144 460 C93.19 460 52 418.81 52 368 L52 144 C52 93.19 93.19 52 144 52 Z M214 106 L298 106 L298 190 L214 190 Z M214 230 L298 230 L298 366 L360 366 L360 406 L152 406 L152 366 L214 366 Z"/>
